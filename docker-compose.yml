services:
  source_db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ferryman
      POSTGRES_DB: ferryman
    ports: ["5433:5432"]
    command: >
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    volumes:
      - ./sql:/sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  target_db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ferryman
      POSTGRES_DB: ferryman
    ports: ["5434:5432"]
    # ponytail: target also runs wal_level=logical so phase 5 reverse CDC needs no restart
    command: >
      postgres -c wal_level=logical -c max_replication_slots=8 -c max_wal_senders=8
    volumes:
      - ./sql:/sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
